name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Testes do código dos nós
        run: node tests/testar-codigo.js
      - name: JSON do fluxo está atualizado com src/
        run: |
          python scripts/gerar-fluxo.py
          git diff --exit-code workflow/ || (echo "Rode: python scripts/gerar-fluxo.py e faça commit do JSON" && exit 1)

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
